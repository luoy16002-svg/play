<!doctype html>
<html lang="en">
  <head>
<link rel="icon" href="data:,">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Possess Anything</title>

    <script type="module" crossorigin src="./assets/index-B3TruAmO.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CByqgJ9F.css">
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div class="goal-card"><div id="goal-level">Level 1</div><div id="goal-text">Get a slice of toast into the fish bowl</div><div id="chips"></div></div>
      <div class="hud-right">
        <button class="icon-btn" id="btn-hint" aria-label="Hint">?</button>
        <button class="icon-btn" id="btn-restart" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" /></svg></button>
        <button class="icon-btn" id="btn-pause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" /><rect x="14" y="5" width="4" height="14" rx="1.5" /></svg></button>
      </div>
      <div id="counter"><span class="ghost-dot"></span><span id="count">0</span></div>
      <div id="action-hint"></div>
      <div id="hint-bubble"></div>
    </div>

    <section id="screen-title" class="screen">
      <div class="logo"><div class="logo-top">POSSESS</div><div class="logo-main">ANYTHING</div></div>
      <div class="title-bottom">
        <button class="btn btn-play" id="btn-play">PLAY</button>
        <button class="btn btn-ghost" id="btn-levels">LEVELS</button>
      </div>
      <button class="icon-btn corner" id="btn-sound" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" /><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round" /></svg></button>
    </section>

    <section id="screen-levels" class="screen hidden">
      <div class="panel wide">
        <div class="panel-title">CHOOSE A PRANK</div>
        <div class="level-grid" id="level-grid"></div>
        <div class="row"><button class="btn btn-ghost" id="btn-levels-back">BACK</button></div>
      </div>
    </section>

    <section id="screen-pause" class="screen hidden">
      <div class="panel">
        <div class="panel-title">PAUSED</div>
        <div class="col">
          <button class="btn btn-play" id="btn-resume">RESUME</button>
          <button class="btn btn-ghost" id="btn-pause-levels">LEVELS</button>
        </div>
        <div class="row toggles">
          <button class="toggle" id="tg-music">MUSIC</button>
          <button class="toggle" id="tg-sfx">SOUND</button>
        </div>
      </div>
    </section>

    <section id="screen-win" class="screen hidden">
      <div class="panel">
        <div class="panel-title" id="win-title">PRANK COMPLETE!</div>
        <div class="stars" id="stars"><span>★</span><span>★</span><span>★</span></div>
        <div class="win-line" id="win-line">2 possessions</div>
        <div class="row">
          <button class="btn btn-ghost" id="btn-again">AGAIN</button>
          <button class="btn btn-play" id="btn-next">NEXT</button>
        </div>
      </div>
    </section>

    <div id="cover-logo" class="hidden"><div class="logo"><div class="logo-top">POSSESS</div><div class="logo-main">ANYTHING</div></div></div>
    <div id="rotate" class="hidden"><div class="rotate-icon"></div><div>Turn your device sideways</div></div>
    <div id="loading"><div class="load-logo">POSSESS ANYTHING</div><div class="load-bar"><div id="load-fill"></div></div></div>

  </body>
</html>
